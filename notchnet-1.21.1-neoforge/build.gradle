plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.36'
    id "com.modrinth.minotaur" version "2.+"
    id "net.darkhax.curseforgegradle" version "1.1.25"
}

// NeoForge 7.1.x overrides version to MC version string; reset it
version = '1.5.0'
group = 'aaravchour.notchnet'
base.archivesName = 'notchnet-1.21.1-neoforge'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    version = '1.21.1'
}

runs {
    client {
        workingDirectory project.file('run')
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        systemProperty 'neoforge.logging.console.level', 'debug'
        modSource sourceSets.main
    }
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.232'
    implementation project(':common')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

// Ensure version is correct after NeoForge plugin overrides
afterEvaluate {
    version = '1.5.0'
    base.archivesName = 'notchnet-1.21.1-neoforge'
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = System.getenv("MODRINTH_PROJECT_ID")
    versionNumber = project.version
    versionName = "NotchNet ${project.version} — MC 1.21.1 NeoForge"
    uploadFile = jar
    gameVersions = ["1.21.1"]
    loaders = ["neoforge"]
    changelog = "Updated to NeoForge 21.1.232 (latest stable). Dependency and build updates."
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    def projectId = System.getenv("CURSEFORGE_PROJECT_ID")
    if (!projectId) {
        println "WARNING: CURSEFORGE_PROJECT_ID not set, skipping CurseForge publish"
        return
    }
    def mainFile = upload(projectId.toInteger(), jar)
    mainFile.releaseType = "release"
    mainFile.changelog = "Updated to NeoForge 21.1.232 (latest stable)"
    mainFile.addGameVersion("1.21.1")
    mainFile.addModLoader("NeoForge")
    mainFile.addJavaVersion("Java 21")
}
